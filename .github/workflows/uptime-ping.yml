name: Render Backend Uptime Ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Unified Backend Health Endpoint
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL || 'https://eventhub-kyn9.onrender.com/health' }}
        run: |
          curl -fsSL --max-time 20 "$HEALTH_URL" || true
