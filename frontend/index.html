  <title>TRACE EventHub & Spaces Tracker - Discover Tech Events & Book Hub Facilities in Sri Lanka</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="TRACE EventHub & Spaces Tracker - Discover Tech Events & Book Hub Facilities in Sri Lanka" />
  <meta name="description" content="Official TRACE EventHub platform. Explore tech workshops, developer meetups, innovation summits, and book world-class facilities across TRACE Expert City, Kandy, Galle, and Jaffna hubs." />

  <meta name="author" content="TRACE Sri Lanka" />

  <!-- Open Graph / Facebook / LinkedIn Social Media Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eventhub.trace.lk/" />
  <meta property="og:title" content="TRACE EventHub & Spaces Tracker" />

  <meta property="twitter:url" content="https://eventhub.trace.lk/" />
  <meta property="twitter:title" content="TRACE EventHub & Spaces Tracker" />
  <meta property="twitter:description" content="Explore tech workshops, developer meetups, innovation summits, and book world-class facilities across TRACE hubs." />
  <meta property="twitter:image" content="https://eventhub.trace.lk/trace-logo.png" />

  <!-- Schema.org JSON-LD Structured Data for Event & Organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TRACE Sri Lanka",
      "url": "https://eventhub.trace.lk",
      "logo": "https://eventhub.trace.lk/trace-logo.png",
      "description": "Technologically Re-Engineering Ability and Competence Everywhere",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "TRACE Expert City, Maradana",
        "addressLocality": "Colombo",
        "addressCountry": "Sri Lanka"
      }
    }
  </script>
